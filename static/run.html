<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Run · tickd</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <aside id="sidebar"></aside>
  <main>
    <!-- Start a run -->
    <div id="new-run" hidden>
      <div class="page-head enter"><h1>New run</h1></div>
      <label class="dropzone enter" style="--i:1" id="dropzone">
        <div id="upload-art"></div>
        <div>Drop an invoice PDF here, or click to choose</div>
        <input type="file" id="file" accept="application/pdf" hidden>
      </label>
      <div id="sample-sets"></div>
    </div>

    <!-- Watch a run -->
    <div id="live" hidden>
      <div class="page-head enter">
        <div>
          <h1 id="run-title">Processing…</h1>
          <div class="meta" id="run-meta"></div>
        </div>
        <div class="actions" style="margin:0">
          <a class="btn" id="pdf-link" target="_blank"></a>
          <a class="btn btn-primary" href="/run" id="again"></a>
        </div>
      </div>

      <section class="card decision" id="decision"></section>

      <div class="grid grid-run">
        <section class="card enter" style="--i:1">
          <div class="card-head"><h2>Live run</h2><span class="clock" id="elapsed">0.0s</span></div>
          <ol class="timeline" id="timeline"></ol>
        </section>
        <section class="card enter" style="--i:2">
          <div class="tabs">
            <span class="tab-thumb"></span>
            <button class="tab active" data-tab="document">Document</button>
            <button class="tab" data-tab="fields">Fields</button>
            <button class="tab" data-tab="lines">PO match</button>
          </div>
          <div id="tab-document" class="tab-panel"></div>
          <div id="tab-fields" class="tab-panel" hidden></div>
          <div id="tab-lines" class="tab-panel" hidden></div>
        </section>
      </div>
    </div>
  </main>
  <script src="/static/app.js"></script>
  <script src="/static/run.js"></script>
</body>
</html>
