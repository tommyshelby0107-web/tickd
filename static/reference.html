<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reference data · tickd by Sid</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
  <script>try{var t=localStorage.getItem("tickd-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"night":"day");document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
  <aside id="sidebar"></aside>
  <main>
    <div class="page-head enter">
      <h1>Reference data</h1>
      <div class="actions" style="margin:0">
        <button class="btn btn-primary" id="add-vendor"></button>
        <button class="btn btn-primary" id="add-po"></button>
        <button class="btn btn-danger" id="reset"></button>
      </div>
    </div>
    <dialog class="modal" id="modal" aria-labelledby="modal-title"></dialog>

    <section class="card enter" style="--i:1;margin-bottom:20px">
      <div class="card-head"><h2>Purchase orders</h2><span class="tag" id="po-count">0</span></div>
      <table>
        <thead><tr><th>PO</th><th>Vendor</th><th>Description</th><th>Status</th><th>Buyer</th><th class="num">Value</th><th class="num">Billed</th><th style="width:150px"></th></tr></thead>
        <tbody id="pos"></tbody>
      </table>
    </section>

    <section class="card enter" style="--i:2;margin-bottom:20px">
      <div class="card-head"><h2>Vendor master</h2><span class="tag" id="vendor-count">0</span></div>
      <table>
        <thead><tr><th>ID</th><th>Vendor</th><th>Status</th><th>Tax ID</th><th>Bank on file</th><th>Phone on file</th><th class="num">Tax rate</th><th>Terms</th></tr></thead>
        <tbody id="vendors"></tbody>
      </table>
    </section>

    <section class="grid grid-2">
      <div class="card enter" style="--i:3">
        <div class="card-head"><h2>Invoice registry</h2><span class="tag" id="registry-count">0</span></div>
        <table>
          <thead><tr><th>Vendor</th><th>Invoice</th><th>Key</th><th class="num">Total</th><th>Status</th></tr></thead>
          <tbody id="registry"></tbody>
        </table>
      </div>
      <div class="card enter" style="--i:4">
        <div class="card-head"><h2>Approval policy</h2><span class="chip">policy.yaml</span></div>
        <table><tbody id="policy"></tbody></table>
      </div>
    </section>
  </main>
  <script src="/static/app.js"></script>
  <script src="/static/coco.js"></script>
  <script src="/static/reference.js"></script>
</body>
</html>
