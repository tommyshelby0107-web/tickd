<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bulk run · tickd</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
  <script>try{var t=localStorage.getItem("tickd-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"night":"day");document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
  <aside id="sidebar"></aside>
  <main>
    <!-- Pick a folder -->
    <div id="pick" hidden>
      <div class="page-head enter"><h1>Bulk run</h1></div>
      <section class="card enter" style="--i:1;margin-bottom:20px">
        <div class="grid grid-2" style="align-items:stretch">
          <label class="dropzone" id="folder-zone">
            <div id="folder-art"></div>
            <div>Choose a folder</div>
            <input type="file" id="folder-input" webkitdirectory directory multiple hidden>
          </label>
          <label class="dropzone" id="files-zone">
            <div id="files-art"></div>
            <div>Or drop several PDFs</div>
            <input type="file" id="files-input" accept="application/pdf" multiple hidden>
          </label>
        </div>
        <div id="preview" hidden style="margin-top:22px">
          <div class="card-head">
            <h2 id="preview-title"></h2>
            <div class="actions" style="margin:0">
              <button class="btn" id="clear">Clear</button>
              <button class="btn btn-primary" id="start"></button>
            </div>
          </div>
          <table>
            <thead><tr><th style="width:40px">#</th><th>File</th><th class="num">Size</th><th></th></tr></thead>
            <tbody id="preview-rows"></tbody>
          </table>
        </div>
      </section>
      <section class="card enter" style="--i:2">
        <div class="card-head"><h2>Recent batches</h2></div>
        <table>
          <thead><tr><th>Batch</th><th>Started</th><th class="num">Invoices</th><th>Progress</th>
            <th class="num">Approved</th><th class="num">Review</th><th class="num">Returned</th><th class="num">Rejected</th></tr></thead>
          <tbody id="batches"></tbody>
        </table>
      </section>
    </div>

    <!-- Watch a batch -->
    <div id="watch" hidden>
      <div class="page-head enter">
        <div>
          <h1 id="batch-title"></h1>
          <div class="meta" id="batch-meta"></div>
        </div>
        <div class="actions" style="margin:0">
          <a class="btn" href="/" id="to-dashboard"></a>
          <a class="btn btn-primary" href="/bulk" id="new-batch"></a>
        </div>
      </div>
      <section class="card enter" style="--i:1;margin-bottom:20px">
        <div class="card-head"><h2 id="progress-text"></h2><span class="clock" id="elapsed"></span></div>
        <div class="progress big live" id="progress"><div id="progress-bar" style="width:0%"></div></div>
        <div class="kpis" style="margin:22px 0 0" id="counts"></div>
      </section>
      <section class="card enter" style="--i:2">
        <table>
          <thead><tr><th style="width:36px">#</th><th>File</th><th>Status</th><th>Vendor</th><th>Invoice</th>
            <th class="num">Total</th><th>Why</th><th class="num">Time</th></tr></thead>
          <tbody id="batch-rows"></tbody>
        </table>
      </section>
    </div>
  </main>
  <script src="/static/app.js"></script>
  <script src="/static/bulk.js"></script>
</body>
</html>
