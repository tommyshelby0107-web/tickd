<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Email inbox · tickd by Sid</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
  <script>try{var t=localStorage.getItem("tickd-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"night":"day");document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
  <aside id="sidebar"></aside>
  <main>
    <div class="page-head enter">
      <div>
        <h1>Email inbox</h1>
        <div class="meta" id="status"></div>
      </div>
      <button class="btn btn-primary" id="check"></button>
    </div>
    <section class="card enter" style="--i:1;margin-bottom:20px" id="setup" hidden></section>
    <section class="card enter" style="--i:2">
      <div class="card-head"><h2>Received</h2><span class="tag" id="count">0</span></div>
      <table>
        <thead><tr><th>Received</th><th>From</th><th>Subject</th><th>Invoices</th><th>Ignored</th></tr></thead>
        <tbody id="emails"></tbody>
      </table>
    </section>
  </main>
  <script src="/static/app.js"></script>
  <script src="/static/inbox.js"></script>
</body>
</html>
